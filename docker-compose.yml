services:

  company-policy-agent:
    build: .

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - chroma_data:/app/storage/chroma
      - checkpoint_data:/app/storage/checkpoints

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


volumes:
  chroma_data:
  checkpoint_data: