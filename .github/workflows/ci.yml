name: Company Policy Agent CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  # --------------------------------------------------
  # 1. Unit / integration tests
  # --------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Build retrieval index
        run: |
          python app/ingest.py

      - name: Verify retrieval index
        run: |
          python -c "from app.retrieval import get_db; print('Chroma documents:', get_db()._collection.count())"

      - name: Verify leave-policy retrieval
        run: |
          python -c "from app.retrieval import search_documents; results = search_documents('What is the company leave policy?'); print('Retrieved documents:', len(results)); assert len(results) > 0"

      - name: Run tests
        run: |
          pytest -q

  # --------------------------------------------------
  # 2. Code quality
  # --------------------------------------------------
  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: |
          ruff check app tests evals *.py

  # --------------------------------------------------
  # 3. Dependency security
  # --------------------------------------------------
  security:
    name: Dependency Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run dependency security audit
        run: |
          pip-audit \
            -r requirements.txt \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

  # --------------------------------------------------
  # 4. Docker build
  # --------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t company-policy-agent:ci .

  # --------------------------------------------------
  # 5. AI safety / approval regression tests
  # --------------------------------------------------
  safety:
    name: Safety Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Build retrieval index
        run: |
          python app/ingest.py

      - name: Run safety tests
        run: |
          pytest -q tests/test_safety.py tests/test_approval_safety.py

  # --------------------------------------------------
  # 6. AI evaluation quality gate
  # --------------------------------------------------
  evaluation-gate:
    name: Evaluation Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build retrieval index
        run: |
          python app/ingest.py

      - name: Run evaluation quality gate
        run: |
          python evals/check_evaluation_gate.py