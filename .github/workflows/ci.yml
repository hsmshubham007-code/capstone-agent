name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build test vector store
        run: |
          python -m app.ingest

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run tests
        run: |
          pytest -q

      - name: Run evaluation gate
        run: |
          python evals/check_evaluation_gate.py

      - name: Run evaluation gate
        run: |
          python evals/check_evaluation_gate.py